<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>VALIA VR Tour</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #050914; }
      #loading { position: fixed; inset: 0; z-index: 2; display: grid; place-items: center; gap: 12px; color: #e2e8f0; font: 600 16px system-ui, sans-serif; background: rgba(5, 9, 20, 0.72); }
      #loading .loader-content { display: grid; justify-items: center; gap: 12px; }
      #loading .loader-icon { width: 32px; height: 32px; border: 3px solid rgba(226, 232, 240, 0.3); border-top-color: #7dd3fc; border-radius: 50%; animation: spin 0.8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      #loading.is-ready { display: none; }
      body.is-loading canvas { cursor: wait; }
      .hotspot { cursor: pointer; }
      .hotspot-label { color: #082f49; font: bold 0.3px system-ui, sans-serif; text-align: center; }
    </style>
  </head>
  <body>
    <div id="loading"><div class="loader-content"><div class="loader-icon" aria-hidden="true"></div><span>Carregando tour...</span></div></div>
    <a-scene background="color: #050914" renderer="colorManagement: true" vr-mode-ui="enabled: true">
      <a-assets id="assets"></a-assets>
      <a-sky id="panorama" radius="5" position="0 2.0 0"></a-sky>
      <a-entity id="hotspots"></a-entity>
      <a-entity id="rig" position="0 0 0">
        <a-entity camera look-controls position="0 1.60 0">
          <a-cursor rayOrigin="mouse" fuse="false" raycaster="objects: .hotspot" material="color: #7dd3fc; shader: flat"></a-cursor>
          <a-ring id="vr-loading" visible="false" position="0 0 -2" radius-inner="0.18" radius-outer="0.24" material="color: #7dd3fc; shader: flat; side: double" animation="property: rotation; to: 0 0 360; loop: true; dur: 800; easing: linear"></a-ring>
        </a-entity>
        <a-entity laser-controls="hand: left" raycaster="objects: .hotspot; far: 30"></a-entity>
        <a-entity laser-controls="hand: right" raycaster="objects: .hotspot; far: 30"></a-entity>
      </a-entity>
    </a-scene>
    <script>
      (async function () {
        const data = await fetch('./data/tour-data.json').then((response) => response.json());
        const sky = document.querySelector('#panorama');
        const hotspots = document.querySelector('#hotspots');
        const loading = document.querySelector('#loading');
        const vrLoading = document.querySelector('#vr-loading');
        const cursor = document.querySelector('a-cursor');
        const images = new Map();
        data.scenes.forEach((scene) => scene.images.forEach((image) => images.set(image.id, image)));

        function currentScene() { return data.scenes.find((scene) => scene.id === data.startSceneId) || data.scenes[0]; }
        let transitionId = 0;

        function renderHotspots(scene, image) {
          (image.anchors || []).forEach((anchor) => {
            const target = images.get(anchor.targetImageId || anchor.target);
            if (!target) return;
            const marker = document.createElement('a-entity');
            marker.classList.add('hotspot');
            marker.setAttribute('visible', 'false');
            marker.setAttribute('position', (anchor.position || [0, 0, -2]).join(' '));
            const scale = Number(anchor.scale) || 1;
            marker.setAttribute('scale', scale + ' ' + scale + ' ' + scale);
            const markerVisual = document.createElement('a-entity');
            markerVisual.classList.add('hotspot');
            markerVisual.setAttribute('position', '0 0.6 0');
            markerVisual.setAttribute('geometry', 'primitive: sphere; radius: 0.28');
            markerVisual.setAttribute('material', 'color: #7dd3fc; emissive: #0369a1; emissiveIntensity: 0.8; opacity: 0.95');
            marker.appendChild(markerVisual);
            const navigate = () => showImage(scene, target.id);
            marker.addEventListener('click', navigate);
            markerVisual.addEventListener('mousedown', (event) => {
              event.stopPropagation();
              navigate();
            });
            hotspots.appendChild(marker);
          });
        }

        function waitForTexture(src) {
          return new Promise((resolve) => {
            let settled = false;
            const finish = () => {
              if (settled) return;
              settled = true;
              sky.removeEventListener('materialtextureloaded', finish);
              window.clearTimeout(timeoutId);
              resolve();
            };
            const timeoutId = window.setTimeout(finish, 10000);
            sky.addEventListener('materialtextureloaded', finish, { once: true });
            sky.setAttribute('src', src);
          });
        }

        async function showImage(scene, imageId) {
          const image = scene.images.find((entry) => entry.id === imageId) || scene.images[0];
          if (!image) return;
          const currentTransitionId = ++transitionId;
          hotspots.innerHTML = '';
          loading.classList.remove('is-ready');
          document.body.classList.add('is-loading');
          vrLoading.setAttribute('visible', 'true');
          cursor.setAttribute('visible', 'false');
          renderHotspots(scene, image);
          await waitForTexture(image.src);
          if (currentTransitionId !== transitionId) return;
          Array.from(hotspots.children).forEach((marker) => marker.setAttribute('visible', 'true'));
          document.body.classList.remove('is-loading');
          vrLoading.setAttribute('visible', 'false');
          cursor.setAttribute('visible', 'true');
          loading.classList.add('is-ready');
        }

        window.addEventListener('click', (event) => {
          if (event.target !== document.querySelector('canvas')) return;
          const cameraEntity = document.querySelector('[camera]');
          const camera = cameraEntity?.components.camera?.camera;
          if (!camera) return;
          const raycaster = new THREE.Raycaster();
          const mouse = new THREE.Vector2(
            (event.clientX / window.innerWidth) * 2 - 1,
            -(event.clientY / window.innerHeight) * 2 + 1
          );
          raycaster.setFromCamera(mouse, camera);
          const intersections = raycaster.intersectObjects(hotspots.object3D.children, true);
          const target = intersections[0]?.object?.el?.closest('.hotspot');
          target?.click();
        });

        const scene = currentScene();
        if (!scene) { loading.textContent = 'Nenhum ambiente disponível.'; return; }
        showImage(scene, scene.startImageId || scene.images[0]?.id);
        loading.classList.add('is-ready');
      }());
    </script>
  </body>
</html>
